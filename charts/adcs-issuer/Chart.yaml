apiVersion: v2
name: adcs-issuer
description: ADCS Issuer plugin for cert-manager.
type: application
version: 2.2.3
appVersion: "2.2.3"
home: https://github.com/djkormo/adcs-issuer
sources:
  - https://github.com/djkormo/adcs-issuer
  - https://djkormo.github.io/adcs-issuer/
kubeVersion: ">=1.27.0-0"

dependencies:

  - name: cert-manager
    alias: cert-manager
    version: ~v1.21.1
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled

  - name: cert-manager
    alias: cert-manager-1-20
    version: ~v1.20.3
    repository: https://charts.jetstack.io
    condition: cert-manager-1-20.enabled

  - name: cert-manager
    alias: cert-manager-1-19
    version: ~v1.19.6
    repository: https://charts.jetstack.io
    condition: cert-manager-1-19.enabled  

  - name: cert-manager
    alias: cert-manager-1-18
    version: ~v1.18.6
    repository: https://charts.jetstack.io
    condition: cert-manager-1-18.enabled


annotations:
  helm.sh/images: |
    - name: manager
      image: djkormo/adcs-issuer:2.2.4
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: manager
      image: djkormo/adcs-issuer:2.2.4
      platforms:
        - linux/amd64
    
  artifacthub.io/crds: |
    - kind: AdcsIssuer
      version: v1
      name: adcsissuer
      displayName: ADCS Issuer  
  artifacthub.io/crdsExamples: |
    - apiVersion: adcs.certmanager.csf.nokia.com/v1
      kind: AdcsIssuer
      metadata:
        name: adcs-issuer
        namespace: adcs-issuer
      spec:
        caBundle: REDACTED
        credentialsRef:
          name: adcs-issuer-credentials
        retryInterval: 5m
        statusCheckInterval: 5m
        templateName: SslWebServer1month
        url: http://adcs-local/certsrv
        

  artifacthub.io/license: Apache-2.0
  
  artifacthub.io/maintainers: |
    - name: djkormo
      email: djkormo@gmail.com
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  
